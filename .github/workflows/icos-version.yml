name: Bump ICOS version

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: icos-version-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Check out the updated default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Choose and apply the semantic version bump
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/core/version.lua | head -n 1)
          if gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' | grep -Fxq 'src/core/version.lua'; then
            echo "This pull request already carries its release version: $current"
            echo "next=$current" >> "$GITHUB_OUTPUT"
            echo "bump=pre-versioned" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          bump=patch
          if grep -Fxq 'version:major' <<<"$labels"; then
            bump=major
          elif grep -Fxq 'version:minor' <<<"$labels"; then
            bump=minor
          fi

          IFS=. read -r major minor patch <<<"$current"

          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac

          sed -i -E 's/^return "[0-9]+\.[0-9]+\.[0-9]+"/return "'"$next"'"/' src/core/version.lua
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Commit the release version
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          BUMP_KIND: ${{ steps.version.outputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/version.lua
          git commit -m "chore: release ICOS v${NEXT_VERSION} (${BUMP_KIND})"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
